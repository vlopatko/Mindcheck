services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: mindcheck
      POSTGRES_PASSWORD: mindcheck-local
      POSTGRES_DB: mindcheck
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./.data/docker-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
